# Render deployment (Blueprint). BASAL public online demo.
# The interface is already compiled in frontend/dist (rebuild with `npm run build` before every push).
services:
  - type: web
    name: basal
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn basal.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BASAL_PUBLIC
        value: "1"
